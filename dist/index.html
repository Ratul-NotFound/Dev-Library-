<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevVault — Minimalist Component & UI Pattern Vault</title>
  <meta name="description" content="High-craft, production-tested web component & pattern library for modern developers. Clean, zero-lag, multi-viewport previews with 1-click HTML/CSS/JS/Tailwind copy." />
  
  <!-- Fonts: Inter for UI & JetBrains Mono for Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Core Stylesheet -->
  <script type="module" crossorigin src="/assets/index-e7fb7qpD.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BeLFzOOE.css">
</head>
<body>
  <!-- Top App Navigation -->
  <header id="app-header" class="app-header"></header>

  <div class="app-layout">
    <!-- Collapsible Category & Filter Sidebar -->
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <!-- Main Content Stream / Component Grid -->
    <main id="app-main" class="app-main">
      <!-- Dynamic Filter Bar & Quick Stats -->
      <section id="filter-bar" class="filter-bar"></section>

      <!-- Component Stream -->
      <section id="component-container" class="component-container">
        <!-- Rendered dynamically -->
      </section>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">🔍</div>
        <h3>No matching components found</h3>
        <p>Try searching for different keywords or create a new snippet with the <strong>+ New Component</strong> button.</p>
        <button id="empty-add-btn" class="btn btn-primary">+ Create Custom Snippet</button>
      </div>
    </main>
  </div>

  <!-- Command Palette Modal (Ctrl+K / Cmd+K) -->
  <div id="command-palette-backdrop" class="modal-backdrop hidden">
    <div id="command-palette-modal" class="modal-dialog command-dialog">
      <div class="command-input-wrapper">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="command-input" placeholder="Search navbars, heroes, carts, animations, auth pages... (Esc to exit)" autocomplete="off" />
        <span class="kbd-badge">ESC</span>
      </div>
      <div id="command-results" class="command-results-list"></div>
      <div class="command-footer">
        <span><kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
        <span><kbd>↵</kbd> to select</span>
        <span><kbd>ESC</kbd> to close</span>
      </div>
    </div>
  </div>

  <!-- Quick-Add / Edit Component Modal (Ctrl+N) -->
  <div id="snippet-modal-backdrop" class="modal-backdrop hidden">
    <div id="snippet-modal" class="modal-dialog snippet-dialog">
      <!-- Injected dynamically by snippetModal.js -->
    </div>
  </div>

  <!-- Import / Export Modal -->
  <div id="backup-modal-backdrop" class="modal-backdrop hidden">
    <div id="backup-modal" class="modal-dialog backup-dialog">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- General Modals Container (Tools, etc.) -->
  <div id="modal-container"></div>

  <!-- Toast Notification Hub -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Entry Script -->
</body>
</html>
